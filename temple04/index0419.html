<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시멘틱 Header</title>
    <style>

        hr {
            width: auto;
            border-color: grey;
        }

        body{
            background-color: black;
            margin-top: 60px;
        }

        p {
            color: white;
        }

        header {
            position: fixed;
            top: 0px;
            width: 100%;
            height: 60px;
            z-index: 1000;
            border-radius: 0px;
            box-shadow: 0px 4px 30px black;
            background-color: #000000;
        
            color: white;
            padding: 20px;
            padding: 15px 0;
            /* border: 1px solid #ccc; */
        }

        .header-container {
            max-width: 2200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 1.8em;
            font-weight: bolder;
        }

        .top-menu {
            display: flex;
            gap: 25px;
        }

        .top-menu a {
            font-weight: thin;
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 10px;
            transition: background-color 0.3s;
        }

        .top-menu a:hover {
            background-color: #737373;
            font-weight: bold;
        }

        fieldset {
            border-radius: 10px;
        }

    </style>
</head>
<body>
    <header>
        <div class="header-container">
        <div class="logo">SPARKLX 블로그</div>    
        <nav class="top-menu">

        <a href="#home">홈</a>
        <a href="#about">소개</a>
        <a href="#portfolio">포트폴리오</a>
        <a href="https://github.com/Linkshimcat" target="_blank">GitHub</a> 
        </nav>
        </div>
    </header><hr>
    <br>

    <script>
        var test, j;
        for (test = 1; test<=5; test++) {
            document.write("<main>");
            for (j = 1; j<=5; j++) {
                document.write("<fieldset>" + "<p>" + "여기에 메인 콘텐츠가 들어갑니다." + "</p>" + "</fieldset>" + "<br>");
            }
            document.write("</main>");
        }
    </script>

    <!-- <footer>
        <div>
            <fieldset>
                <p></p>
            </fieldset>
        </div>
    </footer> -->
</body>
</html>
